server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: lingua-optima-api

  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lingua_optima}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:lingua-optima-super-secure-production-ready-jwt-secret-key-256}
  encryption:
    key: ${ENCRYPTION_KEY:lingua-optima-aes256-encryption-key-for-api-keys}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:mock-groq-key}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:mock-gemini-key}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,https://*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

