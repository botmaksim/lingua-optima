server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: lingua-optima-api

  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lingua_optima}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:mrartissite@gmail.com}
    password: ${SMTP_PASS:fkyxorwhorwbexin}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:lingua-optima-super-secure-production-ready-jwt-secret-key-256}
  curriculum:
    storage-path: ${CURRICULUM_STORAGE_PATH:./data/curriculum}
  encryption:
    key: ${ENCRYPTION_KEY:lingua-optima-aes256-encryption-key-for-api-keys}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:mock-groq-key}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:mock-gemini-key}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:mock-deepseek-key}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    qwen:
      api-key: ${QWEN_API_KEY:mock-qwen-key}
      base-url: ${QWEN_BASE_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    kimi:
      api-key: ${KIMI_API_KEY:mock-kimi-key}
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,https://*}
  pricing:
    free:
      weekly-token-limit: ${PRICING_FREE_TOKEN_LIMIT:50000}
      weekly-evaluation-limit: ${PRICING_FREE_EVAL_LIMIT:10}
      weekly-ocr-limit: ${PRICING_FREE_OCR_LIMIT:3}
      monthly-price-usd: 0.0
    premium:
      weekly-token-limit: ${PRICING_PREMIUM_TOKEN_LIMIT:1000000}
      weekly-evaluation-limit: ${PRICING_PREMIUM_EVAL_LIMIT:500}
      weekly-ocr-limit: ${PRICING_PREMIUM_OCR_LIMIT:100}
      monthly-price-usd: ${PRICING_PREMIUM_PRICE_USD:9.99}
    educator:
      weekly-token-limit: ${PRICING_EDUCATOR_TOKEN_LIMIT:10000000}
      weekly-evaluation-limit: ${PRICING_EDUCATOR_EVAL_LIMIT:10000}
      weekly-ocr-limit: ${PRICING_EDUCATOR_OCR_LIMIT:2000}
      monthly-price-usd: ${PRICING_EDUCATOR_PRICE_USD:49.99}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

